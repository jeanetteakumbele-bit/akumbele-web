<section class="portada portada-historia" style="background-image:url('{{portada}}')">
  <div class="contenedor portada-texto">
    <p class="meta claro">{{meta}}</p>
    <h1>{{titulo}}</h1>
    <p class="portada-sub">{{subtitulo}}</p>
  </div>
</section>

<article class="contenedor estrecho relato">
  <p class="volver"><a href="../historias.html">← Todas las historias</a></p>
  {{cuerpo}}
</article>

<section class="contenedor estrecho siguiente">
  <p class="meta">Siguiente historia</p>
  <a href="{{sig_slug}}.html">{{sig_titulo}} →</a>
</section>

<section class="llamada">
  <div class="contenedor">
    <h2>Cada historia empieza con escuchar</h2>
    <p>Y sigue con agua, huertas y escuela. Tú puedes ser parte de la siguiente.</p>
    <a class="boton grande" href="../colabora.html">Colabora con Akumbele</a>
  </div>
</section>
